name: GTM-001 no-SHA verification
on:
  pull_request:
    paths:
      - '永久記憶/圖靈機/**'
      - 'tests/test_gtm_no_sha.py'
      - '.github/workflows/gtm-no-sha-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent no-SHA Gödel and tape verification
        run: python3 tests/test_gtm_no_sha.py
