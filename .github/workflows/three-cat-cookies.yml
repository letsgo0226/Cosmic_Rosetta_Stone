name: Three Cat Cookies Master
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: three-cat-cookies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  encode-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cookie 1 - encoding and correctness tests
        run: python -m unittest discover -s tests -v
      - name: Cookie 2 - bounded Turing simulation
        run: python pocket.py examples/halts.json --limit 1000 > result.json
      - name: Cookie 3 - verify result
        run: python -c 'import json; r=json.load(open("result.json")); assert r["result"]["status"]=="HALT" and r["result"]["steps"]==2'
      - name: Archive verified simulation result
        uses: actions/upload-artifact@v4
        with:
          name: three-cat-cookies-verified-${{ github.sha }}
          path: |
            pocket.py
            examples/halts.json
            result.json
          if-no-files-found: error
          retention-days: 30
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: encode-and-simulate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - name: Retrieve verified build
        uses: actions/download-artifact@v4
        with:
          name: three-cat-cookies-verified-${{ github.sha }}
          path: dist
      - name: Stage verified artifact
        run: |
          echo 'Verified artifact staged in dist/'
          echo 'No external deployment target configured.'
          test -s dist/result.json
