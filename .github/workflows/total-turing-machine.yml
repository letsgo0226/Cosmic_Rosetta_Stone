name: Deploy total Turing machine

on:
  push:
    branches: [main]
    paths:
      - "machines/**"
      - "deployment/**"
      - "docs/GTM_G_CANONICAL_DEFINITION.md"
      - "docs/UGTM_UNIVERSALITY_SCOPE.md"
      - "TURING_MACHINE_MEMORY.md"
      - ".github/workflows/total-turing-machine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: total-turing-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = json.loads(pathlib.Path("deployment/total_turing_machine.json").read_text())
          assert p["machine_id"] == "ugtm"
          assert p["canonical_name_en"] == "Universal God Turing Machine"
          assert p["version"] == "4.5"
          assert p["system"] == "LMN-Church-Turing-Kleene"
          assert p["role"] == "total_turing_machine"
          assert p["safety"]["live_trading"] is False
          assert pathlib.Path(p["entrypoint"]).is_file()
          assert pathlib.Path(p["definition"]).is_file()
          assert pathlib.Path(p["memory_registry"]).is_file()
          assert pathlib.Path(p["universality_reference"]).is_file()
          PY

      - name: Execute and verify UGTM v4.5
        run: |
          mkdir -p dist
          sh machines/UGTM_v45_2KB.sh > dist/UGTM_v45_report.json
          python3 - <<'PY'
          import json, pathlib
          r = json.loads(pathlib.Path("dist/UGTM_v45_report.json").read_text())
          assert r["version"] == "4.5"
          assert r["system"] == "LMN-Church-Turing-Kleene"
          assert r["machine"] == "Universal God Turing Machine"
          assert r["abbreviation"] == "UGTM"
          assert r["role"] == "total_turing_machine"
          assert r["all_8_ops"] is True
          assert r["closed_sample"] == "S"
          assert r["input_sample"] == "A"
          assert r["pure_lambda_calculus"] is False
          assert r["general_kleene_theorem_proved"] is False
          assert r["church_turing_isomorphism_proved"] is False
          assert r["live_trading"] is False
          PY

      - name: Package deployment artifact
        run: |
          cp machines/UGTM_v45_2KB.sh dist/
          cp machines/K-GTM_v43_LMN_KRT_2KB.sh dist/
          cp machines/GTM-G_v42_2KB.sh dist/
          cp deployment/total_turing_machine.json dist/
          cp docs/GTM_G_CANONICAL_DEFINITION.md dist/
          cp docs/UGTM_UNIVERSALITY_SCOPE.md dist/
          cp TURING_MACHINE_MEMORY.md dist/

      - name: Publish verified total-machine artifact
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-v4.5
          path: dist/
          if-no-files-found: error
          retention-days: 90
