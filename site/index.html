<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rosetta777 | Cosmic Rosetta Stone</title>
<style>
:root{color-scheme:dark;background:#101723;color:#f1f5fa;font:16px/1.6 system-ui,-apple-system,sans-serif}body{max-width:940px;margin:0 auto;padding:36px 20px 72px}h1{font-size:2.2rem;letter-spacing:-.04em;margin-bottom:4px}.muted{color:#9eb0c3}.panel{background:#172334;border:1px solid #304057;border-radius:14px;padding:22px;margin:24px 0}input{background:#111927;color:#fff;border:1px solid #4a627d;border-radius:9px;padding:12px;width:100%;box-sizing:border-box;font:inherit}a{color:#98d4ff}a:hover{color:#d3edff}.item{padding:14px 0;border-top:1px solid #304057}.item:first-child{border-top:0}.small{font-size:.84rem;overflow-wrap:anywhere}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#24455a;color:#b5edff}code{overflow-wrap:anywhere}button{font:inherit;border-radius:8px;background:#24455a;color:white;padding:8px 12px;border:1px solid #507da0;cursor:pointer}
</style></head><body>
<h1>Rosetta777</h1><p class="muted">Cosmic Rosetta Stone · 可驗證的明文圖靈機與影片索引</p>
<section class="panel"><strong>核心驗證</strong><p id="status">載入索引中…</p><p id="digest" class="small muted"></p><p class="small"><a href="./data/check.json">check.json</a> · <a href="./data/index.json">index.json</a> · <a href="https://github.com/letsgo0226/Cosmic_Rosetta_Stone">GitHub 原始碼</a> · <a href="https://www.youtube.com/@777alaje" target="_blank" rel="noopener noreferrer">777ALAJE 官方頻道</a></p></section>
<section class="panel"><label for="query">搜尋影片標題或 ID</label><input id="query" type="search" placeholder="例如 love、meditation、Caduceus" autocomplete="off"><p id="count" class="muted"></p><div id="results"></div></section>
<p class="small muted">本站僅提供公開影片的 ID、標題及 G257 形式編址，不包含字幕、語意證明或永遠可用的即時計算 API。沒有 API 金鑰時，網站會嘗試同步 YouTube 官方 RSS 的近期影片；若無法取得，就顯示同步狀態，不會虛構任何影片。完整歷史公開影片仍需 YouTube Data API。</p>
<script>
const status=document.querySelector('#status'), digest=document.querySelector('#digest'), query=document.querySelector('#query'), count=document.querySelector('#count'), results=document.querySelector('#results');
let data=[];
function render(){const s=query.value.trim().toLowerCase(), rows=data.filter(x=>x.title.toLowerCase().includes(s)||x.id.toLowerCase().includes(s)).slice(0,100);count.textContent='符合搜尋的前 '+rows.length+' 筆／總計 '+data.length+' 筆';results.replaceChildren();for(const v of rows){const box=document.createElement('div');box.className='item';const a=document.createElement('a');a.href='https://www.youtube.com/watch?v='+encodeURIComponent(v.id);a.target='_blank';a.rel='noopener noreferrer';a.textContent=v.title||v.id;const d=document.createElement('div');d.className='small muted';d.textContent='ID: '+v.id+' · G257: '+v.g257;box.append(a,d);results.append(box)}}
query.addEventListener('input',render);
fetch('./data/index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{const c=x.core;data=x.videos||[];status.textContent='G257 / U² / Brainfuck / ATGC：'+(Object.values(c.checks).every(Boolean)?'四項通過':'尚未通過')+' · '+c.bytes+' bytes · 影片 '+data.length+' 筆 · 同步：'+x.sync_status;digest.textContent='SHA-256: '+c.sha256+' · 更新時間：'+x.generated_at;render()}).catch(e=>{status.textContent='索引載入失敗：'+e.message});
</script></body></html>
